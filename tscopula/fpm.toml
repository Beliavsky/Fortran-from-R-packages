name = "tscopula"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Fortran translation contributors"
maintainer = "Fortran translation contributors"
copyright = "Copyright holders of the upstream tscopula package and translation contributors"
description = "Modern Fortran time-series copula models"
categories = ["statistics", "time-series", "copulas"]
gams = ["L"]
keywords = ["copula", "ARMA", "D-vine", "V-transform", "forecasting"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
