name = "GPareto-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "GPareto authors; modern Fortran translation"
maintainer = ""
description = "Modern Fortran translation of the computational core of R package GPareto"
categories = ["numerical", "statistics", "optimization"]
gams = ["E", "G", "L"]
keywords = ["gaussian-process", "pareto", "multiobjective", "kriging"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false
link = ["lapack", "blas"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
