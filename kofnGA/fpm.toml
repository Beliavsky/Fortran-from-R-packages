name = "kofnga-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Mark A. Wolters; Fortran translation"
maintainer = ""
description = "Modern Fortran translation of the computational core of the R package kofnGA"
categories = ["optimization", "genetic-algorithms"]
gams = ["G"]
keywords = ["genetic-algorithms", "feature-selection", "optimization", "numerical-methods"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
