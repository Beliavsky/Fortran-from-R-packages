name = "outliers"
version = "0.15.0"
license = "GPL-2.0-or-later"
author = "Lukasz Komsta; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Outlier tests, scores and tabulated distributions translated from R outliers 0.15"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 14
r_functions_translated = 14
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "chisq.out.test"
r_source = "upstream/R/chisq.out.test.R"
fortran_module = "outliers_api"
fortran_names = ["chisq_out_test"]
fortran_source = "src/outliers_api.f90"
status = "substantial"
notes = "NaN omission, selected endpoint, statistic and upper-tail probability; typed result replaces htest and labels."

[[extra.translation.function]]
r_name = "cochran.test"
r_source = "upstream/R/cochran.test.R"
fortran_module = "outliers_api"
fortran_names = ["cochran_test", "cochran_groups"]
fortran_source = "src/outliers_api.f90"
status = "substantial"
notes = "Variance/count, equal-size matrix, and integer-labelled grouped samples support outlying/inlying tests and ties; R formula evaluation and htest construction omitted."

[[extra.translation.function]]
r_name = "dixon.test"
r_source = "upstream/R/dixon.test.R"
fortran_module = "outliers_api"
fortran_names = ["dixon_test"]
fortran_source = "src/outliers_api.f90"
status = "substantial"
notes = "All six ratio types and automatic type, opposite and two-sided options; upstream tables and anomalies preserved; typed result replaces htest."

[[extra.translation.function]]
r_name = "grubbs.test"
r_source = "upstream/R/grubbs.test.R"
