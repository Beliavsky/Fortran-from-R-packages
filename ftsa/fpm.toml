name = "ftsa"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Rob Hyndman, Han Lin Shang; Fortran translation contributors"
maintainer = "Fortran translation contributors"
description = "Modern Fortran translation of computational routines from the R package ftsa"
categories = ["statistics", "time-series", "functional-data"]

[build]
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 39
r_functions_translated = 39
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "extract"
r_source = "upstream/R/extract.R"
fortran_module = "ftsa_statistics"
fortran_names = ["ftsa_extract_time", "ftsa_extract_x"]
fortran_source = "src/ftsa_statistics.f90"
status = "substantial"
notes = "Numeric time-column and grid-row extraction is translated; R fts object reconstruction and character-time matching are omitted."

