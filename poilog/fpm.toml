name = "poilog-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Vidar Grotan, Steinar Engen; Fortran translation by OpenAI"
maintainer = "Vivek Rao"
copyright = "Copyright (c) original poilog authors and contributors"
description = "Modern Fortran port of the computational core of the R package poilog"
categories = ["probability", "numerical", "statistics"]
gams = ["L"]
keywords = ["probability-distributions", "count-data", "normal-distribution", "probability", "numerical", "statistics", "statistical-computing"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
