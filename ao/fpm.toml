name = "ao-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Lennart Oelschlaeger, Siddhartha Chib; Fortran translation generated from ao 1.2.3"
maintainer = "Translation package"
description = "Modern Fortran translation of the computational core of the R package ao"
categories = ["optimization", "numerical"]
gams = ["G"]
keywords = ["optimization", "numerical", "numerical-methods"]

[library]
