name = "nspmix-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Fortran translation of nspmix by Yong Wang"
description = "Modern Fortran translation of the computational core of the R package nspmix"
categories = ["statistics", "numerical"]
gams = ["L"]
keywords = ["estimation", "mixture-models", "statistics", "numerical", "statistical-computing"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[library]
source-dir = "src"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
