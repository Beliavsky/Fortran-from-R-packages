name = "matrixcalc"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Frederick Novomestky; Fortran translation contributors"
maintainer = "Fortran translation contributors"
description = "Modern Fortran translation of computational routines from the R package matrixcalc"
categories = ["mathematics", "linear-algebra"]

[build]
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 60
r_functions_translated = 60
frac_functions_translated = 1.0
untranslated_r_functions = []

