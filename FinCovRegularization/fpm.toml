name = "fincovregularization"
version = "1.1.0"
license = "GPL-2.0-only"
author = "YaChen Yan and FangZhu Lin; modern Fortran translation generated from FinCovRegularization 1.1.0"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational routines in the R package FinCovRegularization"
keywords = ["finance", "covariance", "regularization", "factor-models", "portfolio"]
categories = ["finance", "statistics", "numerical"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
