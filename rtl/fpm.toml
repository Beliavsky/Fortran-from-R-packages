name = "rtl-fortran"
version = "1.0.0"
license = "MIT"
author = "RTL Authors; modern Fortran translation"
maintainer = "RTL Authors"
copyright = "Copyright (c) 2020 RTL Authors"
description = "Modern Fortran translation of the numerical algorithms in RTL 1.3.9, excluding GARCH"
categories = ["finance", "commodities", "simulation", "option-pricing"]
gams = ["L", "M"]
keywords = ["fortran", "finance", "options", "ornstein-uhlenbeck", "portfolio"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
