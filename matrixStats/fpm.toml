name = "matrixStats"
version = "0.1.0"
license = "Artistic-2.0 AND GPL-2.0-or-later"
author = "matrixStats authors; modern Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Pure modern Fortran matrixStats numerical operations"
[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 99
r_functions_translated = 99
frac_functions_translated = 1.0
untranslated_r_functions = []

