name = "nlme"
version = "3.1.170"
license = "GPL-2.0-or-later"
author = "Original nlme authors; modern Fortran computational port"
maintainer = "Vivek Rao"
description = "Modern Fortran implementation of the computational core of R nlme"
keywords = ["mixed-effects", "gls", "lme", "nonlinear", "correlation"]
categories = ["statistics", "numerical"]
gams = ["L"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
