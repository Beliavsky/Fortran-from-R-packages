name = "vrtest-fortran"
version = "1.2.0"
license = "GPL-2.0-only"
author = "Jae H. Kim; Fortran translation by OpenAI"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the vrtest R package"
keywords = ["variance-ratio", "martingale-difference", "time-series", "bootstrap"]
categories = ["time-series", "statistics", "numerical"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.r-fpm-index]
gams = ["L", "M"]
