name = "tseries_fortran"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Adrian Trapletti, Kurt Hornik, Blake LeBaron; Fortran translation by Vivek Rao"
maintainer = "Vivek Rao"
copyright = "Original tseries authors and contributors; Fortran translation copyright 2026 Vivek Rao"
description = "Experimental modern Fortran translation of computational routines from the R tseries package"
categories = ["statistics", "time-series", "finance"]
keywords = ["arma", "garch", "unit-root", "bootstrap", "fortran"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.r-fpm-index]
gams = ["L", "M"]
