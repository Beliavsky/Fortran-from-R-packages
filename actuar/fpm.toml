name = "actuar-fortran"
version = "0.3.0"
license = "GPL-2.0-or-later"
author = "Vincent Goulet et al.; Fortran translation by OpenAI"
maintainer = "OpenAI translation"
description = "Modern Fortran translation of the computational core of the R package actuar"
keywords = ["actuarial-science", "loss-distributions", "risk-theory", "credibility", "panjer"]
categories = ["actuarial", "probability", "statistics"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[dependencies]
expint-fortran = { path = "dependencies/expint-fortran" }
