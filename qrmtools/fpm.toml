name = "qrmtools"
version = "0.0.19"
license = "GPL-3.0-or-later"
author = "Marius Hofert, Kurt Hornik, Alexander J. McNeil; Fortran translation"
maintainer = "Fortran translation contributors"
copyright = "Copyright (C) 2016 Marius Hofert, Kurt Hornik and Alexander J. McNeil"
description = "Modern Fortran numerical translation of qrmtools"
categories = ["probability", "numerical", "statistics"]
keywords = ["probability-distributions", "probability", "numerical", "statistics", "statistical-computing"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
