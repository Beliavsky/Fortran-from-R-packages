name = "trend"
version = "1.1.8"
license = "GPL-3.0-only"
author = "Thorsten Pohlert; modern Fortran translation contributors"
description = "Trend detection, Sen slopes, change points, and randomness tests"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
Kendall = { path = "../Kendall" }
randtests = { path = "../randtests" }
exactRankTests = { path = "../exactRankTests" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 19
r_functions_translated = 19
frac_functions_translated = 1.0
untranslated_r_functions = []

