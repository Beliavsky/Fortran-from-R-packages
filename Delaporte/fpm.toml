name = "delaporte"
version = "0.1.0"
license = "BSD-2-Clause"
author = "Avraham Adler; standalone Fortran adaptation by OpenAI"
copyright = "Copyright (c) 2013 Avraham Adler"
description = "Modern Fortran implementation of the Delaporte distribution"
