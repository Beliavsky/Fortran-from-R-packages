name = "tmvtnorm-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Fortran port of Stefan Wilhelm and Manjunath B G's tmvtnorm package"
maintainer = "Generated translation"
copyright = "See NOTICE.md and upstream metadata"
description = "Modern Fortran port of the computational core of tmvtnorm"
categories = ["statistics", "probability", "multivariate"]
keywords = ["truncated-normal", "truncated-t", "gibbs", "moments", "gmm"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
mvtnorm-fortran = { path = "../mvtnorm" }

[extra.r-fpm-index]
gams = ["L"]
