name = "evir"
version = "1.7.4"
license = "GPL-2.0-or-later"
author = "Original evir authors; Fortran translation by OpenAI"
maintainer = "Vivek Rao"
copyright = "Copyright original evir authors"
description = "Modern Fortran translation of the computational algorithms in the R package evir"
categories = ["finance", "numerical"]
gams = ["L"]
keywords = ["extreme-value", "finance", "numerical", "numerical-methods"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
