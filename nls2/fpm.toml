name = "nls2-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "OpenAI translation of nls2"
maintainer = ""
description = "Modern Fortran translation of the computational core of the R package nls2"
categories = ["statistics", "numerical"]
keywords = ["regression", "estimation", "statistics", "numerical", "statistical-computing"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[extra.r-fpm-index]
gams = ["L"]
