name = "jrvfinance"
version = "1.4.3"
license = "GPL-2.0-or-later"
author = "Jayanth R. Varma; Fortran translation"
maintainer = "Fortran translation project"
description = "Modern Fortran translation of the computational core of jrvFinance"
keywords = ["npv", "irr", "annuity", "bond", "black-scholes"]
categories = ["actuarial", "finance", "numerical"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
