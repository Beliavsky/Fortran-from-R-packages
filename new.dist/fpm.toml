name = "new-dist-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Ramazan Akman, Coskun Kus, Ihab Abusaif; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational code in R package new.dist"
keywords = ["probability", "distributions", "random-generation"]
categories = ["probability", "numerical", "statistics"]

[library]
source-dir = "src"

[dependencies]
VGAM-fortran = { path = "vendor/VGAM-fortran" }
expint-fortran = { path = "vendor/expint-fortran" }
pracma = { path = "vendor/pracma-fortran" }

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
