name = "ghyp"
version = "1.6.5"
license = "GPL-2.0-or-later"
author = "Marc Weibel, David Luethi, Henriette-Elise Breymann; Fortran translation"
maintainer = "Fortran project maintainers"
copyright = "Copyright (C) ghyp authors"
description = "Modern Fortran numerical core for generalized hyperbolic distributions"
categories = ["statistics", "finance", "probability"]
gams = ["L"]
keywords = ["generalized hyperbolic", "GIG", "NIG", "variance gamma", "Student t"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
