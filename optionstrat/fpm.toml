name = "optionstrat"
version = "1.4.1"
license = "GPL-3.0-only"
author = "John T. Buynak; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "European option pricing, Greeks, probability and spread analytics from R optionstrat 1.4.1"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 24
r_functions_translated = 24
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "calldelta"
r_source = "upstream/R/optionstrat.R"
fortran_module = "optionstrat"
fortran_names = ["calldelta"]
fortran_source = "src/optionstrat.f90"
status = "substantial"
notes = "Numerical operation translated as a pure elemental function. Decimal inputs, source units, and tiny-tenor convention are retained. Explicit zero-volatility limits and NaN validation replace R warnings, recycling, and undefined arithmetic."

