name = "mixsqp-fortran"
version = "0.1.0"
license = "MIT"
author = "Fortran translation of mixsqp authors' computational code"
maintainer = ""
description = "Modern Fortran translation of mixsqp"
categories = ["optimization", "statistics"]
keywords = ["estimation", "mixture-models", "quadratic-programming", "optimization", "statistics", "statistical-computing"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G", "L"]
