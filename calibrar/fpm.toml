name = "calibrar-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Fortran translation of calibrar by Ricardo Oliveros-Ramos"
maintainer = "translation package"
copyright = "Upstream calibrar authors"
description = "Modern Fortran translation of the computational core of R package calibrar"
categories = ["statistics", "numerical"]
keywords = ["estimation", "statistics", "numerical", "statistical-computing"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
