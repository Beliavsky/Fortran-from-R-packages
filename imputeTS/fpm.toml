fortran_module = "imputets_seasonal"
fortran_names = ["na_seadec"]
fortran_source = "src/imputets_seasonal.f90"
status = "substantial"
notes = "Linear pre-imputation, robust STL via the sibling forecast translation, deseasonalization, base-algorithm imputation, seasonal restoration, frequency detection, and maxgap are mapped. Arbitrary ... forwarding and R ts attributes are omitted."

