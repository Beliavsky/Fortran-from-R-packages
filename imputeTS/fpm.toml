fortran_names = ["na_replace"]
fortran_source = "src/imputets_basic.f90"
status = "substantial"
notes = "NaN replacement and maxgap restoration are translated directly for numeric vectors. Upstream multicolumn dispatch and R object preservation are omitted."

[[extra.translation.function]]
r_name = "na_seadec"
