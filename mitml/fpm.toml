name = "mitml"
version = "0.4.5"
license = "GPL-2.0-or-later"
author = "Simon Grund, Alexander Robitzsch, Oliver Luedtke; modern Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of computational routines from the R package mitml"
categories = ["statistics", "multiple-imputation", "multilevel-models"]
keywords = ["multiple-imputation", "rubin-rules", "wald-tests", "mcmc", "multilevel"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.r-fpm-index]
gams = ["L", "M"]
