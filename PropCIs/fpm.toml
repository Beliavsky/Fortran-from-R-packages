name = "propcis"
version = "0.3.0"
license = "GPL-2.0-only"
author = "Ralph Scherer; modern Fortran translation contributors"
maintainer = "Fortran translation contributors"
description = "Confidence intervals for single, paired, and independent proportions"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
extraDistr-fortran = { path = "../extraDistr" }
rcppnumerical = { path = "../RcppNumerical" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 21
r_functions_translated = 21
frac_functions_translated = 1.0
untranslated_r_functions = []

