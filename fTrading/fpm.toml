name = "fTrading"
version = "3042.79.0"
license = "GPL-2.0-or-later AND LGPL-2.0-or-later"
author = "Diethelm Wuertz, Tobias Setz, Yohan Chalabi; Fortran translation contributors"
description = "Modern Fortran translation of fTrading numerical trading utilities"
[build]
auto-executables = false
auto-tests = true
auto-examples = true
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }
TTR = { path = "../TTR" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 40
r_functions_translated = 40
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "maxDrawDown"
r_source = "upstream/R/BenchmarkAnalysis.R"
fortran_module = "ftrading_base"
fortran_names = ["max_draw_down"]
fortran_source = "src/ftrading_base.f90"
status = "substantial"
notes = "All tied troughs and latest preceding peaks are returned as one-based indices. Empty or nonfinite levels yield NaN and empty indices; timeSeries timestamps omitted."

