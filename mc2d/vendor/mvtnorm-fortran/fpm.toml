name = "mvtnorm-fortran"
version = "1.4.2"
license = "GPL-2.0-only"
author = "Alan Genz, Frank Bretz, Tetsuhisa Miwa, Xuefei Mi, Torsten Hothorn, and contributors"
maintainer = "mvtnorm-fortran contributors"
copyright = "Copyright the mvtnorm authors and contributors"
description = "Modern Fortran numerical port of mvtnorm"
categories = ["statistics", "probability", "multivariate"]
keywords = ["multivariate-normal", "multivariate-t", "probability", "cholesky"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
