name = "circstats-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Fortran translation of CircStats by Ulric Lund and Claudio Agostinelli"
maintainer = ""
description = "Modern Fortran computational port of the R CircStats package"
categories = ["statistics", "circular-statistics"]
keywords = ["circular", "von-mises", "wrapped-cauchy", "bootstrap"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
