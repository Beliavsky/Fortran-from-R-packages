name = "dbscan"
version = "1.2.6"
license = "GPL-2.0-or-later"
author = "Michael Hahsler, Matthew Piekenbrock, and dbscan contributors"
maintainer = "Fortran translation maintainers"
copyright = "Upstream copyrights retained; see NOTICE.md and PROVENANCE.md"

[build]
auto-executables = false
auto-examples = false
auto-tests = false
module-naming = false

[[test]]
name = "test_dbscan"
source-dir = "test"
main = "test_dbscan.f90"

[[example]]
name = "basic"
source-dir = "example"
main = "basic.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 25
r_functions_translated = 25
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "adjacencylist"
r_source = "upstream/R/NN.R"
fortran_modules = ["dbscan_nn", "dbscan_api"]
fortran_names = ["adjacencylist_knn", "adjacencylist_frnn"]
fortran_sources = ["src/dbscan_nn.f90", "src/dbscan_api.f90"]
status = "substantial"
notes = "Numeric kNN/frNN adjacency conversion is translated; R S3 class dispatch and attributes are omitted."

[[extra.translation.function]]
r_name = "as.dendrogram"
r_source = "upstream/R/dendrogram.R"
fortran_module = "dbscan_conversion"
fortran_names = ["optics_to_dendrogram"]
fortran_source = "src/dbscan_conversion.f90"
status = "partial"
notes = "A numeric hclust-like dendrogram representation is produced from OPTICS reachability; R dendrogram objects, attributes, and general hclust dispatch are omitted."

[[extra.translation.function]]
r_name = "as.reachability"
r_source = "upstream/R/reachability.R"
fortran_module = "dbscan_conversion"
fortran_names = ["dendrogram_to_reachability"]
fortran_source = "src/dbscan_conversion.f90"
status = "partial"
notes = "A numeric reachability reconstruction is provided for the translated dendrogram type; R dendrogram traversal metadata are not reproduced exactly."

[[extra.translation.function]]
r_name = "comps"
