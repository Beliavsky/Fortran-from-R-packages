name = "etrm"
version = "1.0.2"
license = "MIT"
author = "Anders D. Sleire; Fortran port contributors"
maintainer = "Fortran port contributors"
copyright = "Copyright (c) 2021 etrm authors"
description = "Modern Fortran implementation of computational routines from the etrm R package"
keywords = ["energy", "risk", "hedging", "forward-curve", "portfolio-insurance"]
categories = ["actuarial", "finance", "numerical"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
link = ["lapack", "blas"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
