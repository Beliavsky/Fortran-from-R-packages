name = "matrix-fortran"
version = "1.0.0"
license = "GPL-3.0-only"
author = "Matrix authors; Fortran translation"
maintainer = "Fortran translation project"
copyright = "1999-2026 Matrix authors and contributors"
description = "Modern Fortran dense and sparse matrix algorithms inspired by the R Matrix package"
keywords = ["matrix", "sparse", "linear-algebra", "fpm"]
categories = ["numerical"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["D"]
