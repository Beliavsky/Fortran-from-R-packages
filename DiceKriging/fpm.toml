name = "dicekriging"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "DiceKriging authors; modern Fortran translation"
maintainer = ""
description = "Modern Fortran translation of the computational core of R package DiceKriging"
categories = ["numerical", "statistics"]
gams = ["E", "L"]
keywords = ["kriging", "gaussian-process", "design-of-experiments"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
