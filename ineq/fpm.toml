name = "ineq"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Achim Zeileis, Christian Kleiber; Fortran translation contributors"
description = "Inequality, concentration, poverty and Lorenz curve computations from R ineq"
[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 26
r_functions_translated = 26
frac_functions_translated = 1.0
untranslated_r_functions = []

