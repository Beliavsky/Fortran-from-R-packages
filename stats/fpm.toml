name = "stats-fortran"
version = "0.1.0"
license = "MIT"
author = "Vivek Rao and contributors"
maintainer = "Vivek Rao"
description = "Modern Fortran interfaces corresponding to computational functions in the R stats package"
categories = ["statistics", "regression", "time-series", "numerical"]
keywords = ["R", "stats", "linear-models", "inference", "clustering"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fastcluster = { path = "../fastcluster" }
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }
rfortran-optional = { path = "../rfortran-optional" }

[dev-dependencies]
stats-test-support = { path = "test-support" }

[extra.r-fpm-index]
gams = ["L"]

[extra.translation]
status = "partial"
coverage_basis = "R 4.6.0 public namespace exports; partial mappings count as represented"
r_functions_total = 465
r_functions_translated = 89
frac_functions_translated = 0.191398

