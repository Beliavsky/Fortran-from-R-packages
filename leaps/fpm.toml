name = "leaps-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Thomas Lumley, Alan Miller; Fortran translation assembled for this project"
copyright = "See LICENSE.md and upstream source headers"
description = "Modern Fortran/FPM translation of the computational code in the R package leaps"
categories = ["statistics", "regression", "subset-selection"]
gams = ["G", "L"]
keywords = ["linear-regression", "best-subsets", "leaps-and-bounds", "fortran"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
