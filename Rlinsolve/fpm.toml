fortran_module = "rlinsolve"
fortran_names = ["lsolve_ssor"]
fortran_source = "src/rlinsolve.f90"
status = "substantial"
notes = "The upstream SSOR iteration matrix, constant term, and matrix-RHS column looping are translated. Sparse inputs retain the public sparse API but triangular SSOR factors are materialized densely."
