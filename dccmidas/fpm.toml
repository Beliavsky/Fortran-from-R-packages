name = "dccmidas"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Vincenzo Candila; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of the computational core of the R package dccmidas"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }
roll = { path = "../roll" }
rumidas = { path = "../rumidas" }
rugarch_fortran = { path = "../rugarch" }
maxlik = { path = "../maxLik" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 22
r_functions_translated = 22
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "dccmidas_loglik"
r_source = "upstream/R/functions.R"
fortran_module = "dccmidas_dcc"
fortran_names = ["dccmidas_loglik"]
fortran_source = "src/dccmidas_dcc.f90"
status = "substantial"
notes = "The DCC-MIDAS likelihood recursion is translated; R array/list validation and xts metadata are omitted."

