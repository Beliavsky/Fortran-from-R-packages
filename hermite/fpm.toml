name = "hermite-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "David Morina Soler, Manuel Higueras, Pedro Puig, Maria Oliveira; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the generalized Hermite distribution package"
keywords = ["hermite", "generalized-hermite", "count-data", "regression"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
