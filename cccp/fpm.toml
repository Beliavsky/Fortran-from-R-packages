name = "cccp-fortran"
version = "0.3.3"
license = "GPL-3.0-or-later"
author = "Bernhard Pfaff; Fortran translation by OpenAI"
maintainer = "Vivek Rao"
description = "Modern Fortran port of cccp cone-constrained convex optimization algorithms"
categories = ["optimization", "numerical", "finance"]
keywords = ["linear-programming", "quadratic-programming", "socp", "sdp", "risk-parity"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G", "L"]
