name = "fdapace"
version = "0.1.0"
license = "BSD-3-Clause"
author = "fdapace authors; Fortran translation contributors"
maintainer = "Fortran-from-R-packages project"
description = "Substantial modern Fortran translation of computational routines from the R package fdapace"

[build]
auto-executables = false
auto-examples = false
auto-tests = false
module-naming = false

[library]
source-dir = "src"

[[test]]
name = "test_fdapace"
source-dir = "test/basic"
main = "test_fdapace.f90"

[[test]]
name = "test_advanced"
source-dir = "test/advanced"
main = "test_advanced.f90"

[[example]]
name = "dense_fpca"
source-dir = "example"
main = "dense_fpca.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 48
r_functions_translated = 48
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "BwNN"
r_source = "upstream/R/BwNN.R"
fortran_module = "fdapace_statistics"
fortran_names = ["bw_nn"]
fortran_source = "src/fdapace_statistics.f90"
status = "substantial"
notes = "Unique-neighbor mean/covariance bandwidths are translated. The Fortran path makes onlyMean work as documented instead of reproducing an upstream undefined-variable edge case."

