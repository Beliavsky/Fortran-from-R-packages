name = "geepack"
version = "0.1.0"
license = "GPL-3.0-or-later"
author = "Soren Hojsgaard, Ulrich Halekoh, Jun Yan, Claus Thorn Ekstrom; modern Fortran translation maintained for Fortran-from-R-packages"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran computational translation of the R package geepack"
categories = ["statistics", "generalized-estimating-equations"]
keywords = ["gee", "longitudinal", "clustered-data", "ordinal", "sandwich"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[install]
library = true

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
