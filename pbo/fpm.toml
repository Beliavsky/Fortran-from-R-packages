name = "pbo"
version = "1.3.5"
license = "MIT"
author = "Matthew R. Barry (original R package); Fortran translation contributors"
maintainer = "Fortran translation contributors"
copyright = "Copyright (c) 2014 Matthew R. Barry"
description = "Modern Fortran implementation of probability of backtest overfitting"
keywords = ["backtest", "overfitting", "cscv", "finance", "statistics"]
categories = ["finance", "probability", "statistics"]
gams = ["L"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
