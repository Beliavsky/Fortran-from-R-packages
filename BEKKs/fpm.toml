name = "bekks"
version = "1.4.7"
license = "MIT"
author = "Markus J. Fuelle, Alexander Lange, Christian M. Hafner, Helmut Herwartz; Fortran port by OpenAI"
maintainer = ""
copyright = "Copyright (c) 2021 Markus Fuelle, Helmut Herwartz, Alexander Lange, Christian Hafner"
description = "Modern Fortran implementation of BEKK multivariate conditional-volatility models"
categories = ["statistics", "finance", "econometrics"]
keywords = ["BEKK", "MGARCH", "volatility", "VaR"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
