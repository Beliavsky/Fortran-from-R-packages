name = "adagio-fortran"
version = "0.1.0"
license = "GPL-3.0-or-later"
author = "Hans W. Borchers; Fortran translation"
maintainer = "Fortran translation generated from adagio 0.9.2"
copyright = "Copyright (c) the original adagio authors and contributors"
description = "Modern Fortran translation of the computational routines in the R package adagio"
categories = ["optimization", "numerical"]
keywords = ["global-optimization", "optimization", "numerical", "numerical-methods"]

[library]
source-dir = "src"

[dependencies]
lpsolve-fortran = { path = "../lpSolve" }

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G"]
