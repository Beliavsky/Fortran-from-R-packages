fortran_names = ["generator_otrimle"]
fortran_source = "src/otrimle_simulation.f90"
status = "substantial"
notes = "Noise resampling and multivariate-normal component simulation are translated; intrinsic Fortran RNG streams replace R rmultinom/sample and mvtnorm::rmvnorm streams."

[[extra.translation.function]]
r_name = "otrimleg"
r_source = "upstream/R/otrimle_nc.R"
fortran_module = "otrimle_mod"
fortran_names = ["otrimleg"]
fortran_source = "src/otrimle_simulation.f90"
status = "substantial"
notes = "Candidate-G fitting, parameter counts, improper BIC, OTRIMLE criterion, noise probability, logicd, and density diagnostics are translated serially; multicore R orchestration is omitted."

[[extra.translation.function]]
