name = "runuran-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Fortran translation of Runuran/UNU.RAN by OpenAI"
maintainer = ""
description = "Modern Fortran computational translation of Runuran and core UNU.RAN generators"
categories = ["statistics", "random-number-generation"]
gams = ["L", "M"]
keywords = ["UNU.RAN", "random variates", "Monte Carlo", "distributions"]

[build]
