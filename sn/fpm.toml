name = "sn-fortran"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Adelchi Azzalini; modern Fortran port contributors"
maintainer = "Modern Fortran port contributors"
copyright = "Copyright (C) upstream and port contributors"
description = "Modern Fortran implementation of skew-normal, skew-t, skew-Cauchy, multivariate and SUN distributions"
