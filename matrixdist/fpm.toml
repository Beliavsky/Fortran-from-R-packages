name = "matrixdist-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Martin Bladt, Jorge Yslas; Fortran translation by OpenAI"
maintainer = "OpenAI translation"
description = "Modern Fortran computational port of the R matrixdist package"

[build]
auto-executables = false
auto-tests = true
auto-examples = true

[dependencies]
rfortran-compat = { path = "../rfortran-compat" }
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["Z"]
