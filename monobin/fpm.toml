name = "monobin"
version = "0.2.4"
license = "GPL-3.0-or-later"
author = "Andrija Djurovic (upstream R); Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Seven monotonic binning algorithms for binary and continuous credit-risk responses"
[build]
auto-tests = true
auto-examples = true
auto-executables = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }
Hmisc = { path = "../Hmisc" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 7
r_functions_translated = 7
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "pct.bin"
r_source = "upstream/R/01_PCT_BINNING.R"
fortran_module = "monobin"
fortran_names = ["pct_bin"]
fortran_source = "src/monobin.f90"
status = "substantial"
notes = "Iterative cut2 percentile grouping with binary mean or continuous WoE trend checks. Typed arrays replace R data frames and formatted bin labels; see README for NA, prediction, and documented defect handling."

