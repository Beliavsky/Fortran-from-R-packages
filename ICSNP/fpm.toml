name = "icsnp"
version = "1.1.3"
license = "GPL-2.0-or-later"
author = "Klaus Nordhausen, Seija Sirkia, Hannu Oja, David E. Tyler; Fortran translation"
maintainer = "Fortran translation project"
copyright = "Copyright original ICSNP authors and Fortran translation contributors"
description = "Modern Fortran translation of the computational core of the R package ICSNP"
categories = ["statistics", "numerical"]
keywords = ["multivariate-statistics", "statistics", "numerical", "statistical-computing"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
