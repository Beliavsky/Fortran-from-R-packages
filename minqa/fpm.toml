name = "minqa"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Douglas Bates, Katharine M. Mullen, John C. Nash, Ravi Varadhan; Fortran port"
maintainer = "Fortran port maintainers"
description = "Modern Fortran interfaces to Powell derivative-free quadratic approximation optimizers"
keywords = ["optimization", "derivative-free", "bobyqa", "newuoa", "uobyqa"]
categories = ["optimization", "numerical"]
gams = ["G", "K"]

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[library]
source-dir = "src"

[[test]]
name = "test_minqa"
source-dir = "test"
main = "test_minqa.f90"

[[example]]
name = "minqa_example"
source-dir = "example"
main = "minqa_example.f90"
