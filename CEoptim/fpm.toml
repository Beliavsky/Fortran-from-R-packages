name = "CEoptim-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Fortran translation of CEoptim by OpenAI"
maintainer = ""
copyright = "Original CEoptim authors; Fortran translation"
description = "Modern Fortran translation of the computational core of the R package CEoptim"
categories = ["optimization", "statistics"]
keywords = ["cross-entropy", "optimization", "truncated-normal", "dirichlet"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
link = ["lapack", "blas"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
