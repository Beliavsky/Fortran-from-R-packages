name = "vars"
version = "1.6.1"
license = "GPL-2.0-or-later"
author = "Bernhard Pfaff; Matthieu Stigler; Fortran translation contributors"
copyright = "Copyright upstream vars authors and contributors; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of computational routines from the R package vars"

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[fortran]
source-form = "free"
implicit-typing = false
implicit-external = false

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[[test]]
name = "vars-tests"
source-dir = "test"
main = "test_vars.f90"

[[example]]
name = "fit-var"
source-dir = "example"
main = "fit_var.f90"

[[example]]
name = "impulse-response"
source-dir = "example"
main = "impulse_response.f90"
