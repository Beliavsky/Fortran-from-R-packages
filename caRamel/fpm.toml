name = "caramel-fortran"
version = "0.1.0"
license = "GPL-3 | file LICENSE"
author = "caRamel authors; Fortran port"
copyright = "See upstream DESCRIPTION and LICENSE"
description = "Modern Fortran port of the computational core of the R package caRamel"
categories = ["optimization", "multiobjective"]
keywords = ["multiobjective", "pareto", "evolutionary", "optimization"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G"]
