name = "normalp-fortran"
version = "0.1.0"
license = "GPL"
author = "Fortran translation of normalp"
maintainer = ""
description = "Modern Fortran routines for the exponential power (generalized error) distribution"
categories = ["probability", "statistics", "numerical"]
keywords = ["regression", "estimation", "probability-distributions", "exponential-power-distribution", "probability", "statistics", "numerical", "statistical-computing"]

[library]
source-dir = "src"

[[test]]
name = "test_normalp"
source-dir = "test"
main = "test_normalp.f90"

[[executable]]
name = "normalp_example"
source-dir = "example"
main = "normalp_example.f90"

[[test]]
name = "test_simulation"
source-dir = "test"
main = "test_simulation.f90"
