name = "nvmix"
version = "0.1.2"
license = "GPL-3.0-or-later"
author = "Marius Hofert, Erik Hintz, Christiane Lemieux; Fortran translation by OpenAI"
maintainer = "OpenAI"
copyright = "Copyright (C) 2018 Marius Hofert, Erik Hintz and Christiane Lemieux"
description = "Modern Fortran numerical library for multivariate normal variance mixtures"
categories = ["statistics", "probability", "risk"]
gams = ["L"]
keywords = ["normal variance mixtures", "student t", "copulas", "risk measures"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
