name = "NetworkRiskMeasures"
version = "0.1.7"
license = "GPL-3.0-only"
author = "Carlos Cinelli, Thiago Cristiano Silva; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Directed financial-network risk, contagion, communicability and reconstruction"

[build]
auto-executables = false
auto-tests = true
auto-examples = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
expm-fortran = { path = "../expm" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 12
r_functions_translated = 12
frac_functions_translated = 1.0
untranslated_r_functions = []

