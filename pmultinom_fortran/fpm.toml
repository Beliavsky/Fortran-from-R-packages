name = "pmultinom-fortran"
version = "1.0.0"
license = "AGPL-3.0-only"
author = "Alexander Davis; Fortran translation by OpenAI"
maintainer = ""
copyright = "Copyright retained by the upstream pmultinom authors"
description = "Modern Fortran translation of the computational core of the R package pmultinom"
categories = ["probability", "numerical", "statistics"]
