name = "rpeglmen"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "RPEGLMEN authors; modern Fortran translation"
maintainer = "Modern Fortran translation contributors"
description = "Elastic-net Gamma and exponential generalized linear models"
categories = ["statistics", "optimization", "finance"]
keywords = ["elastic-net", "gamma-glm", "exponential-glm", "FISTA", "cross-validation"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
