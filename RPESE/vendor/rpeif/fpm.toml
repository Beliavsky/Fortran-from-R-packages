name = "rpeif"
version = "0.1.0"
license = "GPL-3.0-or-later"
author = "RPEIF authors; modern Fortran translation"
maintainer = "Modern Fortran translation contributors"
description = "Influence functions for risk and performance measures"
categories = ["statistics", "finance", "risk-management"]
keywords = ["influence-functions", "VaR", "expected-shortfall", "Sharpe", "Sortino"]

[library]
source-dir = "src"

[dependencies]
robstattm-lite = { path = "vendor/robstattm-lite" }

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
