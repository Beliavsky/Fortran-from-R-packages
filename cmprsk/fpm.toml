name = "cmprsk"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Robert Gray; modern Fortran translation maintained for Fortran-from-R-packages"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran computational translation of the R package cmprsk"
categories = ["statistics", "survival-analysis", "competing-risks"]
keywords = ["competing-risks", "fine-gray", "cumulative-incidence", "gray-test"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[install]
library = true

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
