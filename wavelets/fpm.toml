name = "wavelets"
version = "0.3.0"
license = "GPL-2.0-or-later"
author = "Eric Aldrich; modern Fortran translation contributors"
maintainer = "Modern Fortran translation contributors"
copyright = "Upstream wavelets package authors and contributors"
description = "Modern Fortran translation of the computational core of the R package wavelets"

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 17
r_functions_translated = 17
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "align"
r_source = "upstream/R/align.R"
fortran_module = "wavelets_transform"
fortran_names = ["align"]
fortran_source = "src/wavelets_transform.f90"
status = "substantial"
notes = "Numerical coefficient alignment and inverse alignment are translated; R S4/class metadata handling is represented by typed Fortran components."

[[extra.translation.function]]
r_name = "dwt"
