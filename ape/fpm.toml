name = "ape"
version = "5.8.1"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Emmanuel Paradis et al.; Fortran translation contributors"
copyright = "Copyright ape authors/copyright holders; see UPSTREAM_DESCRIPTION and NOTICE.md"
homepage = "https://github.com/emmanuelparadis/ape"
description = "Modern Fortran translation of computational kernels from the R package ape"
categories = ["phylogenetics", "statistics", "scientific-computing"]
keywords = ["phylogenetics", "neighbor-joining", "comparative-methods", "DNA"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }
