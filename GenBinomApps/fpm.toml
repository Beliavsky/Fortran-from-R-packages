name = "GenBinomApps-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Horst Lewitschnig and David Lenzi; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the R GenBinomApps package"
keywords = ["poisson-binomial", "generalized-binomial", "clopper-pearson", "confidence-interval"]
categories = ["probability", "numerical", "statistics"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
