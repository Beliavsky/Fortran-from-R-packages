name = "rfortran-linalg"
version = "0.1.0"
license = "MIT"
author = "Vivek Rao and contributors"
maintainer = "Vivek Rao"
description = "Shared linear algebra for Fortran translations of R packages"
categories = ["numerical", "linear-algebra"]
keywords = ["BLAS", "LAPACK", "linear-systems", "eigenvalues", "cholesky"]

[build]
auto-executables = false
auto-examples = false
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortran-lapack = { git = "https://github.com/perazz/fortran-lapack.git", rev = "9982df3b660918761b993eaf0ff2e507547e25b2" }

[extra.r-fpm-index]
gams = ["D"]
