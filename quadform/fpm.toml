name = "quadform-fortran"
version = "0.1.0"
license = "GPL"
author = "Robin K. S. Hankin (original R package); Fortran translation"
maintainer = "Fortran translation"
copyright = "Original quadform copyright retained"
description = "Modern Fortran translation of the computational code in the R quadform package"
categories = ["numerical"]
keywords = ["numerical", "numerical-methods", "algorithms"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
