name = "grf"
version = "2.6.1"
license = "GPL-3.0-only"
author = "GRF upstream authors and Fortran translation contributors"
maintainer = "Fortran-from-R-packages project"
description = "Modern Fortran translation of computational generalized random forest routines from the R package grf"

[build]
auto-executables = false
auto-tests = true
auto-examples = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 41
r_functions_translated = 41
frac_functions_translated = 1.0
untranslated_r_functions = []

