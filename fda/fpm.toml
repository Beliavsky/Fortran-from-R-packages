name = "fda"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "James Ramsay, Giles Hooker, Spencer Graves; Fortran translation"
maintainer = "Fortran translation"
description = "Modern Fortran translation of the portable computational core of the R fda package"
categories = ["numerical", "statistics", "functional-data-analysis"]
keywords = ["FDA", "splines", "smoothing", "PCA", "CCA", "ODE"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[library]
source-dir = "src"
