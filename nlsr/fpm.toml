name = "nlsr-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Fortran translation of nlsr by John C. Nash et al."
maintainer = "OpenAI translation"
description = "Modern Fortran translation of the computational core of the R package nlsr"
categories = ["numerical", "optimization", "nonlinear-least-squares"]
keywords = ["least-squares", "numerical", "optimization", "nonlinear-least-squares", "numerical-methods"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[extra.r-fpm-index]
gams = ["G"]
