name = "peerperformance"
version = "2.4.0"
license = "GPL-2.0-or-later"
author = "David Ardia, Kris Boudt, and contributors; Fortran translation generated from the supplied source"
maintainer = "PeerPerformance upstream authors"
copyright = "Copyright (C) 2012-2023 David Ardia and Kris Boudt"
description = "Modern Fortran implementation of luck-corrected peer performance analysis"
categories = ["finance", "statistics"]
keywords = ["peer performance", "Sharpe ratio", "modified Sharpe", "false discovery rate"]

[build]
