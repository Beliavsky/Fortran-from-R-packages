name = "fkf"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "FKF authors and Fortran port contributors"
maintainer = "Fortran port contributors"
copyright = "See upstream/FKF-master/DESCRIPTION and source headers"
description = "Fast multivariate Kalman filtering and smoothing with missing data"
categories = ["statistics", "time-series", "kalman-filter"]
keywords = ["kalman", "filter", "smoother", "state-space"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
