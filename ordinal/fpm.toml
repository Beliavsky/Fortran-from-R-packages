name = "ordinal"
version = "2026.7.26"
license = "GPL-2.0-or-later"
author = "Rune Haubo Bojesen Christensen; modern Fortran translation"
maintainer = "Fortran-from-R-packages project"
copyright = "2011-2026 R. H. B. Christensen"
description = "Modern Fortran translation of cumulative-link models from the R package ordinal"
categories = ["statistics", "regression", "mixed-models"]
keywords = ["ordinal-regression", "cumulative-link-models", "mixed-models", "laplace-approximation", "quadrature"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
