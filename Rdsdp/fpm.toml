name = "rdsdp-fortran"
version = "0.3.0"
license = "GPL-3.0-only AND LicenseRef-DSDP AND Apache-2.0"
author = "Rdsdp/DSDP authors; modern Fortran translation by OpenAI"
maintainer = ""
copyright = "See LICENSE and licenses/"
categories = ["optimization"]
keywords = ["optimization", "numerical-methods", "algorithms"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G"]
