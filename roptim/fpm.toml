name = "roptim"
version = "0.1.1"
license = "GPL-2.0-or-later"
author = "Yi Pan and Fortran port contributors"
maintainer = "Fortran port maintainers"
copyright = "2018 Yi Pan; see NOTICE.md"
description = "Modern Fortran general-purpose optimization: Nelder-Mead, BFGS, CG, L-BFGS-B, and SANN"
keywords = ["optimization", "nelder-mead", "bfgs", "conjugate-gradient", "lbfgsb", "annealing"]
categories = ["optimization", "numerical"]
gams = ["G"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[library]
source-dir = "src"
