name = "hierportfolios-fortran"
version = "1.0.2"
license = "GPL-2.0-only"
author = "Carlos Trucios, Moon Jun Kwon; Fortran translation"
maintainer = "Fortran translation project"
copyright = "Copyright the HierPortfolios authors and contributors"
description = "Modern Fortran translation of HierPortfolios"
categories = ["finance", "portfolio", "clustering"]
keywords = ["HRP", "HERC", "HCAA", "DHRP"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
