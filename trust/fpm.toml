name = "trust-fortran"
version = "0.1.0"
license = "MIT"
author = "Modern Fortran translation of Charles J. Geyer's trust package"
maintainer = "OpenAI translation"
copyright = "2005, 2008 Charles J. Geyer; Fortran translation 2026"
description = "Modern Fortran translation of the computational core of the R trust package"
categories = ["optimization"]
gams = ["G"]
keywords = ["trust-region", "optimization", "newton", "hessian"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
