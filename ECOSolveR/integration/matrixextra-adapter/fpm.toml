name = "ecos-matrixextra-adapter"
version = "0.4.0"
license = "GPL-3.0-only"
author = "Fortran translation integration"
description = "Zero-densification MatrixExtra adapter for ECOSolveR-fortran"

[build]
auto-executables = false
auto-examples = true
auto-tests = false
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
ecosolver-fortran = { path = "../.." }
matrixextra-fortran = { path = "../../../MatrixExtra" }
