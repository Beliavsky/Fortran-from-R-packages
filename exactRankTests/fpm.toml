name = "exactRankTests"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Torsten Hothorn, Kurt Hornik; Fortran translation contributors"
description = "Exact conditional rank and permutation distributions with tie support"
[build]
auto-executables = false
auto-tests = true
auto-examples = true
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 18
r_functions_translated = 15
frac_functions_translated = 0.8333333333333334
untranslated_r_functions = ["wilcox.exact.formula", "ansari.exact.formula", "perm.test.formula"]

