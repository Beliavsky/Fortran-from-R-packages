name = "gRain"
version = "1.4.6"
license = "GPL-2.0-or-later"
author = "Soren Hojsgaard and gRain contributors; Fortran translation"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of the computational core of the R gRain Bayesian-network package"

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
gRbase = { path = "../gRbase" }
