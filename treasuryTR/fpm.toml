name = "treasurytr"
version = "0.1.0"
license = "MIT"
author = "treasuryTR authors; Fortran translation contributors"
maintainer = "Fortran translation contributors"
copyright = "Copyright (c) 2021 treasuryTR authors"
description = "Modern Fortran translation of the computational routines in treasuryTR"
categories = ["finance", "fixed-income", "statistics"]
keywords = ["treasury", "bond", "duration", "convexity", "total-return"]

[build]
auto-executables = true
auto-tests = true
auto-examples = false
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
