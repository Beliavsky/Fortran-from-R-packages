[[extra.translation.function]]
r_name = "binom.optim"
r_source = "upstream/R/binom.optim.R"
fortran_module = "binom_optimization"
fortran_names = ["binom_optim"]
fortran_source = "src/binom_optimization.f90"
status = "substantial"
notes = "Symmetric confidence optimization, beta-integrated squared coverage loss and shared L-BFGS-B with R-style fixed finite differences. Supports k, p0, transform, start and bounded solver controls. Raw closed-form trial algebra, partial-NaN removal and empty-count integration failures follow R; all-invalid zero-loss artifacts are rejected and invalid final intervals return failure. Public intervals retain (0,1). No R callbacks, plotting or general optim scaling arguments."
