name = "binom"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Sundar Dorai-Raj, Arianna D. Cascone; Fortran translation contributors"
description = "Binomial confidence intervals, coverage, length, power, design and coverage optimization"
[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }
lbfgsb3 = { path = "../lbfgsb3" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 18
r_functions_translated = 18
frac_functions_translated = 1.0
untranslated_r_functions = []

