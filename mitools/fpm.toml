name = "mitools"
version = "2.4.0"
license = "GPL-2.0-only"
author = "Thomas Lumley; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of computational routines from the R package mitools"
categories = ["statistics"]
keywords = ["multiple-imputation", "Rubin-rules", "plausible-values"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.r-fpm-index]
gams = ["L"]
