name = "funData"
version = "1.3.9"
license = "GPL-2.0-only"
author = "Clara Happ-Kurz (upstream); Fortran translation"
maintainer = "Fortran translation maintainers"
description = "Modern Fortran translation of computational funData operations."

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[library]
source-dir = "src"

[[test]]
name = "unit"
source-dir = "test/unit"
main = "test_core.f90"

[[test]]
name = "simulation"
source-dir = "test/simulation"
main = "test_simulation.f90"

[[example]]
name = "basic_usage"
source-dir = "example"
main = "basic_usage.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 20
r_functions_translated = 20
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = ".intWeights"
r_source = "upstream/R/funDataMethods.R"
fortran_module = "funData_numeric"
fortran_names = ["int_weights"]
fortran_source = "src/funData_numeric.f90"
status = "complete"
notes = "Trapezoidal and midpoint quadrature weights are translated, including the upstream short-grid fallback."

