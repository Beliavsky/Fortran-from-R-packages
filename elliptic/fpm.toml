name = "elliptic-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Robin K. S. Hankin (upstream elliptic package); Fortran translation"
maintainer = "Fortran translation project"
description = "Modern Fortran translation of the computational core of the R elliptic package"
categories = ["mathematics", "special-functions"]
keywords = ["elliptic", "weierstrass", "jacobi", "theta", "modular"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[library]
source-dir = "src"
