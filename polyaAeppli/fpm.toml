name = "polyaAeppli-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Conrad Burden; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the R polyaAeppli package"
keywords = ["polya-aeppli", "compound-poisson", "geometric-poisson", "probability"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
