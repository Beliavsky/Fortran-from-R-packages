name = "desolve"
version = "0.1.1"
license = "GPL-2.0-or-later"
author = "Karline Soetaert, Thomas Petzoldt, R. Woodrow Setzer; Fortran translation"
maintainer = "Fortran translation"
description = "Modern free-format Fortran/FPM translation of the computational core of R deSolve"
categories = ["numerical", "ode", "dae"]
keywords = ["ODEPACK", "LSODA", "VODE", "DASPK", "RADAU5", "Runge-Kutta", "DDE"]

[fortran]
source-form = "free"
implicit-typing = true
implicit-external = true

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[library]
source-dir = "src"
