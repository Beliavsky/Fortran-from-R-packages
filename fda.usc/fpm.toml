name = "fda-usc"
version = "2.2.0"
license = "GPL-2"
author = "Manuel Febrero Bande, Manuel Oviedo de la Fuente; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
copyright = "Upstream fda.usc authors and contributors"
description = "Modern Fortran translation of computational routines from the R package fda.usc"

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[[test]]
name = "unit"
source-dir = "test/unit"
main = "test_fdausc.f90"

[[test]]
name = "statistics"
source-dir = "test/statistics"
main = "test_statistics.f90"

[[test]]
name = "extended"
source-dir = "test/extended"
main = "test_extended.f90"

[[test]]
name = "generalized"
source-dir = "test/generalized"
main = "test_generalized.f90"

[[example]]
name = "basic"
source-dir = "example"
main = "basic.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
