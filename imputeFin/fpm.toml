name = "imputefin"
version = "0.1.2"
license = "GPL-3.0-only"
author = "Original imputeFin authors; Fortran translation"
maintainer = "Fortran translation project"
description = "Financial time-series imputation with Gaussian and Student-t AR/VAR models"
categories = ["finance", "time-series", "statistics"]
keywords = ["imputation", "missing-data", "AR", "VAR", "Student-t"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
