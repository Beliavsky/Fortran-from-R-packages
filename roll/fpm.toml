name = "roll"
version = "1.2.1"
license = "GPL-2.0-or-later"
author = "Jason Foster; Fortran translation contributors"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of computational rolling statistics from the R package roll"
categories = ["statistics", "time-series"]
keywords = ["rolling", "moving-window", "statistics", "regression", "R"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 18
r_functions_translated = 18
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "roll_all"
r_source = "upstream/R/roll.R"
fortran_modules = ["roll_univariate", "roll_matrix"]
fortran_names = ["roll_all_vec", "roll_all_mat"]
fortran_sources = ["src/roll_univariate.f90", "src/roll_matrix.f90"]
status = "substantial"
notes = "Vector and matrix rolling all are translated; R object attributes and parallel online/offline worker selection are omitted."

