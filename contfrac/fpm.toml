name = "contfrac-fortran"
version = "0.1.0"
license = "GPL-2"
author = "Robin K. S. Hankin (original contfrac package)"
maintainer = "Fortran translation maintainers"
copyright = "Original contfrac copyright holders"
description = "Modern Fortran translation of the computational core of the R package contfrac"
keywords = ["continued-fractions", "numerical-analysis", "complex-arithmetic"]
categories = ["numerical"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
