name = "fgarch"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "fGarch authors; experimental Fortran translation"
maintainer = "Vivek Rao"
copyright = "1999-2025 fGarch authors; 2026 Fortran translation contributors"
description = "Experimental modern Fortran translation of the computational core of R fGarch"
keywords = ["garch", "aparch", "volatility", "statistics", "finance"]
categories = ["finance", "time-series", "statistics"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
