name = "mlrmbo-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Fortran port of mlrMBO computational routines"
maintainer = ""
copyright = "mlrMBO authors and contributors"
categories = ["optimization", "statistics", "numerical"]
keywords = ["bayesian-inference", "optimization", "statistics", "numerical", "statistical-computing"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
dicekriging = { path = "../DiceKriging" }

[extra.r-fpm-index]
gams = ["G", "L"]
