name = "alabama"
version = "0.1.1"
license = "GPL-2.0-or-later"
author = "Ravi Varadhan; Fortran translation contributors"
maintainer = "Fortran translation maintainers"
copyright = "Ravi Varadhan and contributors; see NOTICE.md"
description = "Modern Fortran computational port of the R alabama constrained optimization package"
keywords = ["optimization", "constraints", "augmented-lagrangian", "barrier"]
categories = ["optimization", "numerical"]
gams = ["G"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[library]
source-dir = "src"

[dependencies]
numDeriv-fortran = { path = "dependencies/numDeriv-fortran" }
roptim = { path = "dependencies/roptim" }
