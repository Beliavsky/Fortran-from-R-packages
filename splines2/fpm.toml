name = "splines2"
version = "0.5.4"
license = "GPL-3.0-or-later"
author = "Wenjie Wang and Jun Yan; modern Fortran translation contributors"
maintainer = "Beliavsky/Fortran-from-R-packages"
description = "B, M, I, C, periodic, natural and Bernstein spline bases and calculus"

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
splines-fortran = { path = "../splines" }
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 15
r_functions_translated = 15
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "bSpline"
r_source = "upstream/R/bSpline.R"
fortran_module = "splines2"
fortran_names = ["b_spline"]
fortran_source = "src/splines2.f90"
status = "substantial"
notes = "Ordinary and periodic B-splines, derivatives, integrals, and automatic or explicit knots. R classes, attributes, dimnames, formula integration, coercion, and warning emission are omitted; typed results expose settings and status."

