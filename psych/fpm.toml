name = "psych"
version = "2.6.5"
license = "GPL-2.0-or-later"
author = "William Revelle (upstream); Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of computational portions of the R package psych"

[build]
auto-executables = false
auto-tests = false
auto-examples = false
module-naming = false

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }

[[test]]
name = "unit"
source-dir = "test/unit"
main = "test_unit.f90"

[[test]]
name = "algorithms"
source-dir = "test/algorithms"
main = "test_algorithms.f90"

[[test]]
name = "extended"
source-dir = "test/extended"
main = "test_extended.f90"

[[test]]
name = "computational-extended"
source-dir = "test/computational_extended"
main = "test_computational_extended.f90"

[[test]]
name = "more-extended"
source-dir = "test/more_extended"
main = "test_more_extended.f90"

[[example]]
name = "basic"
source-dir = "example"
main = "basic_example.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 344
r_functions_translated = 344
frac_functions_translated = 1.0
untranslated_r_functions = []



[[extra.translation.function]]
r_name = "circadian.reliability"
r_source = "upstream/R/cosinor.R"
fortran_module = "psych_computational_extended"
fortran_names = ["circadian_reliability_split"]
fortran_source = "src/psych_computational_extended.f90"
status = "substantial"
notes = "Implements the grouped numerical split-half core by fitting cosinors within each subject, correlating split phases circularly and fit statistics linearly across subjects, and applying the Spearman-Brown correction. R data-frame grouping, plotting, and the split-phase F table are omitted."

[[extra.translation.function]]
r_name = "crossValidationBoot"
