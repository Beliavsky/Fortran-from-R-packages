fortran_module = "psych_computational_extended"
fortran_names = ["cross_validation_bootstrap"]
fortran_source = "src/psych_computational_extended.f90"
status = "partial"
notes = "Implements complete-data bootstrap derivation and out-of-bag validation using standardized correlation-regression weights, returning trial fits and mean coefficients. Formula parsing, lmCor object handling, product terms, missing-data behavior, and exact R resampling streams are omitted."

[[extra.translation.function]]
