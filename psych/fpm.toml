[[extra.translation.function]]
r_name = "omegaSem"
r_source = "upstream/R/omegaSem.R"
fortran_module = "psych_omega_sem"
fortran_names = ["omega_sem_bifactor"]
fortran_source = "src/psych_omega_sem.f90"
status = "substantial"
notes = "Implements omegaSem's specialized numerical path without a generic lavaan dependency: Schmid-Leiman loadings define the bifactor zero pattern, an orthogonal standardized bifactor CFA is fitted by normal-theory maximum likelihood with analytic gradients and BFGS, and omegaFromSem statistics are computed from the fitted loadings. Correlation-matrix input is supported; raw-data conversion, arbitrary lavaan model syntax/options, lavaan fit objects, labels, plotting, and exact lavaan optimizer/fit-test metadata are omitted."

