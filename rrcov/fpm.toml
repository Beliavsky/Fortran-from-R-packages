name = "rrcov"
version = "0.1.0"
license = "GPL-3.0-or-later"
author = "Valentin Todorov; Fortran translation"
maintainer = "Fortran translation project"
description = "Modern Fortran translation of rrcov robust multivariate computational algorithms"
categories = ["statistics", "robust-statistics", "multivariate-analysis"]
keywords = ["robust-covariance", "pca", "lda", "qda", "mcd", "ogk"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.r-fpm-index]
gams = ["D", "L"]
