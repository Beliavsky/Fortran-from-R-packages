name = "geometry"
version = "0.5.2"
license = "GPL-3.0-or-later"
author = "geometry R-package authors; Fortran translation"
maintainer = "Fortran translation maintainers"
copyright = "Upstream geometry authors and contributors"
description = "Pure-Fortran translation of computational routines from the R geometry package"

[build]
auto-executables = false
auto-examples = false
auto-tests = false
module-naming = false

[library]
source-dir = "src"

[[test]]
name = "unit"
source-dir = "test/unit"
main = "main.f90"

[[test]]
name = "geometry"
source-dir = "test/geometry"
main = "main.f90"

[[example]]
name = "geometry_example"
source-dir = "example"
main = "main.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 35
r_functions_translated = 35
frac_functions_translated = 1.0
untranslated_r_functions = []

