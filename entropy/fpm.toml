name = "entropy"
version = "1.0.0"
license = "GPL-3.0-or-later"
author = "Jean Hausser, Korbinian Strimmer; Fortran translation contributors"
description = "Entropy, mutual information, divergence and shrinkage estimators translated from R entropy 1.3.2"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 34
r_functions_translated = 33
frac_functions_translated = 0.9705882352941176
untranslated_r_functions = ["entropy.NSB"]

[[extra.translation.function]]
