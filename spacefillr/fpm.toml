name = "spacefillr-fortran"
version = "0.1.0"
license = "MIT"
author = "spacefillr authors; Fortran translation"
maintainer = "Fortran translation"
description = "Modern Fortran port of spacefillr space-filling sequences"
categories = ["simulation", "numerical"]
gams = ["M"]
keywords = ["simulation", "numerical", "numerical-methods"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
