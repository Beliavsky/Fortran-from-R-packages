name = "rm2006"
version = "0.1.1"
license = "GPL-2.0-or-later"
author = "Carlos Trucios; Fortran port contributors"
maintainer = "Fortran port contributors"
copyright = "2020 Carlos Trucios"
description = "Modern Fortran implementation of the RiskMetrics 2006 conditional covariance methodology"
categories = ["finance", "statistics", "time-series"]
keywords = ["riskmetrics", "covariance", "ewma", "volatility"]

[build]
