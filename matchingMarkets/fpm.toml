name = "matchingmarkets-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Thilo Klein et al.; Fortran translation"
maintainer = "Fortran translation"
description = "Modern Fortran translation of matchingMarkets computational algorithms"
categories = ["finance", "optimization", "numerical"]
keywords = ["combinatorial-optimization", "finance", "optimization", "numerical", "numerical-methods"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
matchingr-fortran = { path = "vendor/matchingr-fortran" }
lpsolve-fortran = { path = "vendor/lpsolve-fortran" }
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.r-fpm-index]
gams = ["G", "L"]
