name = "qrng-fortran"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Marius Hofert, Christiane Lemieux; modern Fortran translation"
maintainer = "Fortran port contributors"
description = "Modern Fortran/FPM translation of the computational core of the R package qrng"
keywords = ["quasi-random", "sobol", "halton", "korobov", "qmc"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["f90"]
