name = "rumidas"
version = "0.1.3"
license = "GPL-3.0-only"
author = "Vincenzo Candila; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational core of the R package rumidas"
categories = ["statistics", "econometrics", "finance"]
keywords = ["GARCH-MIDAS", "DAGM", "MEM-MIDAS", "volatility", "mixed-frequency"]

[library]
source-dir = "src"

[dependencies]
maxlik = { path = "../maxLik" }

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true

[extra.r-fpm-index]
gams = ["L"]
