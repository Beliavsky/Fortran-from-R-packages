name = "maxlik"
version = "1.5.2"
license = "GPL-2.0-or-later"
author = "Ott Toomet; Arne Henningsen; maxLik contributors; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational core of the R package maxLik"
categories = ["optimization", "statistics", "econometrics"]
keywords = ["maximum-likelihood", "Newton-Raphson", "BHHH", "BFGS", "stochastic-gradient"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true
