name = "rmumps"
version = "0.3.0"
license = "GPL-2.0-or-later"
author = "Fortran translation of rmumps; upstream rmumps by Serguei Sokol and contributors"
maintainer = ""
copyright = "Upstream wrapper copyright 2015-2026 INRAE/INSA/CNRS; see NOTICE.md and UPSTREAM_COPYRIGHTS"
description = "Modern Fortran translation of the computational API of the R package rmumps"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.translation]
status = "partial"
coverage_basis = "exported computational R functions"
r_functions_total = 13
r_functions_translated = 13
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "Rmumps"
r_source = "upstream/R/zzz.R"
fortran_module = "rmumps_api"
fortran_names = ["rmumps_init_triplet", "rmumps_init_triplet_zero_based"]
fortran_source = "src/rmumps_api.f90"
status = "partial"
notes = "Constructs the Fortran rmumps_matrix type from one-based or upstream-style zero-based sparse triplets. Matrix/dgTMatrix/simple_triplet_matrix object conversion, Rcpp ownership, copy=FALSE aliasing, and the MUMPS sparse backend are omitted."

