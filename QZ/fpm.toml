name = "qz"
version = "0.2.4"
license = "MPL-2.0"
author = "Wei-Chen Chen; LAPACK authors; Fortran translation contributors"
maintainer = "Wei-Chen Chen <wccsnow@gmail.com>"
copyright = "See LICENSE, NOTICE.md, and LICENSES/LAPACK_LICENSE.txt"
description = "Modern Fortran translation of the computational API of the R package QZ"

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortran-lapack = { git = "https://github.com/Beliavsky/fortran-lapack.git" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 18
r_functions_translated = 18
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "qz.dgees"
r_source = "upstream/R/qz_dgees.r"
fortran_module = "qz_lapack"
fortran_names = ["qz_dgees"]
fortran_source = "src/qz_lapack.f90"
status = "complete"
notes = "Real Schur decomposition is translated through the explicit GEE(S) interface in fortran-lapack; R list/class construction is omitted."

