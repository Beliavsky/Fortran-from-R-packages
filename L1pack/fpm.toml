name = "l1pack-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Fortran translation of L1pack by Felipe Osorio and Tymoteusz Wolodzko"
maintainer = ""
description = "Modern Fortran translation of the numerical core of the R L1pack package"
categories = ["statistics", "numerical"]
keywords = ["estimation", "statistics", "numerical", "statistical-computing"]

[library]
source-dir = "src"

[dependencies]
fastmatrix-fortran = { path = "../fastmatrix" }

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[extra.r-fpm-index]
gams = ["L"]
