name = "loo"
version = "2.10.1"
license = "GPL-3.0-or-later"
author = "loo authors and Fortran translation contributors"
maintainer = "Beliavsky/Fortran-from-R-packages contributors"
description = "Pareto smoothed importance sampling and Bayesian predictive assessment"
[build]
auto-executables = false
auto-tests = true
auto-examples = true
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }
matrixStats = { path = "../matrixStats" }
posterior = { path = "../posterior" }

