name = "gogarch-modern-fortran"
version = "0.2.0"
license = "GPL-2.0-or-later"
author = "Bernhard Pfaff; Fortran translation contributors"
maintainer = "Fortran translation contributors"
copyright = "2008-2026 Bernhard Pfaff and translation contributors"
description = "Modern Fortran translation of the computational core of the R package gogarch"
categories = ["finance", "statistics", "time-series"]
keywords = ["GO-GARCH", "GARCH", "APARCH", "ICA", "volatility", "Student-t", "GED"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.r-fpm-index]
gams = ["L"]
