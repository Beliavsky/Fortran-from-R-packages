name = "vares"
version = "1.0.2"
license = "GPL-2.0-or-later"
author = "VaRES authors; Fortran port"
maintainer = "Fortran port"
description = "Modern Fortran implementation of VaRES parametric VaR and expected-shortfall formulas"
categories = ["finance", "statistics", "risk"]
keywords = ["value-at-risk", "expected-shortfall", "distributions"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.r-fpm-index]
gams = ["L"]
