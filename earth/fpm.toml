name = "earth"
version = "5.3.6"
license = "GPL-3.0-only"
author = "Stephen Milborrow, Trevor Hastie, Rob Tibshirani; Fortran translation"
maintainer = "Fortran-from-R-packages project"
copyright = "Upstream earth authors and contributors; see NOTICE.md"
description = "Modern Fortran translation of the computational core of the R earth package"
categories = ["statistics", "regression", "mars"]
keywords = ["MARS", "regression", "splines", "earth"]

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[library]
source-dir = "src"

[[test]]
name = "test_earth"
source-dir = "test"
main = "test_earth.f90"

[[example]]
name = "basic_earth"
source-dir = "example"
main = "basic_earth.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 19
r_functions_translated = 15
frac_functions_translated = 0.7894736842105263
untranslated_r_functions = ["coef.varmod", "mars.to.earth", "predict.varmod", "update.earth"]

