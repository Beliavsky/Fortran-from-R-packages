name = "pbs"
version = "1.1.0"
license = "GPL-2.0-only"
author = "Shuangcai Wang; Fortran translation generated for Beliavsky/Fortran-from-R-packages"
maintainer = "Beliavsky/Fortran-from-R-packages"
description = "Modern Fortran translation of the computational API of the R package pbs"
categories = ["numerical", "statistics", "splines"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 2
r_functions_translated = 2
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "pbs"
r_source = "upstream/R/pbs.R"
fortran_module = "pbs_api"
fortran_names = ["pbs"]
fortran_source = "src/pbs_api.f90"
status = "substantial"
notes = "Periodic and ordinary B-spline basis construction, type-7 quantile knot selection, missing values, and nonperiodic boundary extrapolation are translated; R attributes, dimnames, warnings, and S3 class construction are represented by a typed Fortran result rather than R objects."

[[extra.translation.function]]
r_name = "predict.pbs"
r_source = "upstream/R/pbs.R"
fortran_module = "pbs_api"
fortran_names = ["predict_pbs"]
fortran_source = "src/pbs_api.f90"
status = "substantial"
notes = "Reuses stored degree, knots, boundary knots, intercept, and periodic settings on new predictor values; R ellipsis and S3 dispatch are omitted."
