notes = "Both upstream censored-Gaussian branches are translated on explicit numeric designs: flexmix_lmc covers the no-random-effects FLXMRlmc path, and flexmix_lmmc covers random effects. One censored response in a mixed-model group uses exact analytic truncated-normal moments; multiple censored responses use a deterministic Genz-style Halton quasi-Monte-Carlo upper-truncation integral (up to 32 censored dimensions). Shared residual variance and, for the mixed branch, shared random covariance are supported. R formula/model-frame construction and mvtnorm integration-control arguments are omitted."

