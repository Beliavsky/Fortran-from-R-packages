name = "CreditRisk"
version = "0.1.7"
license = "MIT"
author = "Alessandro Cimarelli and Nicolò Manca; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
copyright = "Copyright (c) 2017 Alessandro Cimarelli & Nicolò Manca"
description = "Structural credit-risk models, CDS valuation and bounded calibration translated from CreditRisk 0.1.7"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = true

[dependencies]
rfortran-core = { path = "../rfortran-core" }
lbfgsb3 = { path = "../lbfgsb3" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 13
r_functions_translated = 13
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "BlackCox"
r_source = "upstream/R/BlackCox.R"
fortran_module = "creditrisk"
fortran_names = ["black_cox"]
fortran_source = "src/creditrisk.f90"
status = "complete"
notes = "Numerical operation retained; typed arrays and status replace R data frames, validation, and recycling."

