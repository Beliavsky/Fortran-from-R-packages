name = "gmp"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Antoine Lucas, Immanuel Scholz, Rainer Boehme, Sylvain Jasson, Martin Maechler; Fortran translation by OpenAI"
maintainer = "Fortran-from-R-packages project"
description = "Pure-Fortran arbitrary-precision integer and rational computational translation of R package gmp"

[build]
auto-executables = false
auto-tests = true
auto-examples = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.translation]
