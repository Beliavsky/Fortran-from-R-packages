name = "irr"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Matthias Gamer, Jim Lemon, Ian Fellows, Puspendra Singh; Fortran translation contributors"
description = "Inter-rater agreement, reliability, homogeneity tests, and sample-size calculations"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }
lpsolve-fortran = { path = "../lpSolve" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 19
r_functions_translated = 19
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "agree"
r_source = "upstream/R/agree.R"
fortran_module = "irr_agreement"
fortran_names = ["agree"]
fortran_source = "src/irr_agreement.f90"
status = "substantial"
notes = "Percentage agreement with numeric tolerance and complete-case deletion."

