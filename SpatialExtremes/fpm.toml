name = "spatialextremes-fortran"
version = "0.4.0"
license = "GPL-2.0-or-later"
author = "SpatialExtremes authors; Fortran translation"
maintainer = ""
description = "Modern Fortran computational port of the R SpatialExtremes package"
categories = ["statistics", "probability", "spatial", "extreme-value"]
keywords = ["spatial-extremes", "max-stable", "gev", "copula", "kriging"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-compat = { path = "../rfortran-compat" }
rfortran-linalg = { path = "../rfortran-linalg" }

[extra.r-fpm-index]
gams = ["L", "M"]
