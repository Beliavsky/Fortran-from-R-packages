name = "rnd"
version = "1.2.0"
license = "GPL-2.0-or-later"
author = "Kam Hamidieh; Fortran translation contributors"
maintainer = "Fortran translation contributors"
copyright = "Copyright (C) 2017 Kam Hamidieh"
description = "Modern Fortran translation of the computational routines in the RND R package"
categories = ["finance", "statistics", "option-pricing"]
