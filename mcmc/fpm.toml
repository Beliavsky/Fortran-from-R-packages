name = "mcmc-fortran"
version = "0.1.0"
license = "MIT"
author = "Charles J. Geyer and Leif T. Johnson; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational core of R mcmc"
keywords = ["mcmc", "metropolis", "tempering", "batch-means"]
categories = ["simulation", "numerical"]
gams = ["L", "M"]

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
