name = "spam-fortran"
version = "0.1.0"
license = "mixed; see LICENSES/ and NOTICE.md"
author = "Fortran translation of spam computational code; upstream authors retained in NOTICE.md"
maintainer = ""
copyright = "See NOTICE.md and upstream/"
description = "Modern Fortran/FPM port of the computational core of the R package spam"
categories = ["numerical", "linear-algebra", "sparse-matrix"]
keywords = ["sparse-matrix", "cholesky", "arpack", "kriging", "covariance"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
link = ["lapack", "blas"]

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"

[dependencies]
rfortran-compat = { path = "../rfortran-compat" }

[preprocess]
[preprocess.cpp]
suffixes = ["F90"]

[extra.r-fpm-index]
gams = ["D"]
