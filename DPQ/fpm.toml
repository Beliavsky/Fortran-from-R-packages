name = "dpq-fortran"
version = "0.1.0"
license = "GPL-3.0-or-later"
author = "Martin Maechler and DPQ contributors; modern Fortran translation"
maintainer = "Fortran port contributors"
description = "Modern Fortran/FPM translation of the computational core of the R package DPQ"
keywords = ["probability", "distribution", "quantile", "approximation", "noncentral"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[dependencies]
rfortran-compat = { path = "../rfortran-compat" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
[preprocess.cpp]
suffixes = ["F90"]

[extra.r-fpm-index]
gams = ["K", "L"]
