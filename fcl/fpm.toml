name = "fcl"
version = "0.1.4"
license = "MIT"
author = "fcl authors; Fortran translation"
maintainer = "Fortran translation"
copyright = "Copyright (c) 2024 fcl authors"
description = "Modern Fortran financial calculator translated from fcl"
categories = ["finance", "numerical"]
keywords = ["fixed-income", "finance", "numerical", "numerical-methods"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
