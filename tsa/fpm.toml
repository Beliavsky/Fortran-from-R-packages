name = "tsa-fortran"
version = "0.5.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Kung-Sik Chan, Brian Ripley; modern Fortran translation"
copyright = "Original TSA authors and contributors; see NOTICE"
description = "Modern Fortran/FPM translation of computational routines from R package TSA 1.3.1"
categories = ["statistics", "time-series"]
keywords = ["arima", "arimax", "setar", "spectral", "diagnostics", "fortran"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
leaps-fortran = { path = "../leaps" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
