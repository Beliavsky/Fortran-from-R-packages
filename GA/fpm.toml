name = "ga-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Luca Scrucca; Fortran translation"
maintainer = "Fortran translation"
description = "Modern Fortran translation of computational algorithms from the R GA package"
categories = ["optimization", "genetic-algorithm", "differential-evolution"]
