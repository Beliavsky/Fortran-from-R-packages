name = "evd-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Fortran translation of evd by Alec Stephenson and contributors"
maintainer = ""
copyright = "See LICENSES and NOTICE"
description = "Modern Fortran translation of the computational core of the R package evd"

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[dependencies]
rfortran-compat = { path = "../rfortran-compat" }

[preprocess]
[preprocess.cpp]
suffixes = ["f90"]

[extra.r-fpm-index]
gams = ["Z"]
