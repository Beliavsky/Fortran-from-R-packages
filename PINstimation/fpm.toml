name = "pinstimation"
version = "0.2.0"
license = "GPL-3.0-or-later"
author = "Montasser Ghachem, Oguz Ersan; Fortran translation"
maintainer = "Fortran translation contributors"
copyright = "2020-2025 PINstimation authors and contributors"
description = "Modern Fortran computational translation of the PINstimation R package"
keywords = ["market-microstructure", "PIN", "MPIN", "AdjPIN", "VPIN", "Fortran"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
