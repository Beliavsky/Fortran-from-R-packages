name = "pbivnorm-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Alan Genz; Brenton Kenkel; Fortran port"
maintainer = ""
copyright = "See NOTICE.md"
description = "Modern Fortran implementation of the bivariate normal distribution function"
categories = ["statistics", "probability"]
keywords = ["bivariate-normal", "normal-distribution", "cdf", "probability"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
