name = "bigstatsr-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Florian Prive et al.; Fortran translation"
maintainer = ""
copyright = "See LICENSES.md"
description = "Modern Fortran computational-core translation of bigstatsr"
categories = ["statistics", "numerical"]
keywords = ["statistics", "numerical", "statistical-computing"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[dependencies]
rfortran-arpack = { path = "../rfortran-arpack" }
fortran-lapack = { git = "https://github.com/perazz/fortran-lapack.git", rev = "9982df3b660918761b993eaf0ff2e507547e25b2" }
rspectra-fortran = { path = "../RSpectra" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
