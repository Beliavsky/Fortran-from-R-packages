name = "mgcv-fortran"
version = "0.1.1"
license = "GPL-2.0-or-later"
author = "Simon N. Wood; modern Fortran port"
maintainer = "OpenAI"
copyright = "Copyright (C) Simon N. Wood and contributors"
description = "Modern Fortran numerical core inspired by R mgcv"
keywords = ["gam", "smoothing", "splines", "irls", "reml", "gcv"]
categories = ["statistics", "numerical"]
gams = ["E", "L"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[dependencies]
splines = { path = "dependencies/splines" }
