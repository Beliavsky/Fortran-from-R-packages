name = "lgarch-modern-fortran"
version = "0.1.0"
license = "GPL-2.0-only"
author = "Modern Fortran translation of lgarch by Genaro Sucarrat"
maintainer = "Translation project"
description = "Simulation and estimation of univariate and multivariate log-GARCH models"
