keywords = ["estimation", "multivariate-statistics", "garch", "financial-econometrics", "finance", "time-series", "simulation", "modeling"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
link = ["lapack", "blas"]
