name = "glmmTMB"
version = "1.1.14"
license = "AGPL-3.0-only"
author = "Mollie Brooks et al.; Fortran translation"
maintainer = "Fortran translation project"
description = "Modern Fortran translation of portable computational kernels from glmmTMB"

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
TMB = { path = "../TMB" }
