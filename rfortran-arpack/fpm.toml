name = "rfortran-arpack"
version = "0.1.0"
license = "BSD-3-Clause"
author = "ARPACK authors; r_fpm backend integration"
maintainer = ""
copyright = "Copyright (c) 1996-2008 Rice University and contributors"
description = "Pinned ARPACK-NG double-precision eigensolvers for r_fpm translations"

[library]
source-dir = "src"

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[dependencies]
fortran-lapack = { git = "https://github.com/perazz/fortran-lapack.git", rev = "9982df3b660918761b993eaf0ff2e507547e25b2" }

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"

[extra.r-fpm-index]
gams = ["Z"]
