name = "gkwdist-fortran"
version = "0.1.0"
license = "MIT"
author = "Jose Evandeilton Lopes; Fortran translation"
maintainer = "Fortran translation maintainers"
copyright = "2025 gkwreg authors"
description = "Modern Fortran implementation of the Generalized Kumaraswamy distribution family"
keywords = ["probability", "kumaraswamy", "beta", "maximum-likelihood", "distributions"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[library]
source-dir = "src"

[dependencies]
numDeriv-fortran = { path = "vendor/numderiv-fortran" }
