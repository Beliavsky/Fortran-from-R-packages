name = "distr-fortran"
version = "0.2.0"
license = "LGPL-3.0-only"
author = "Fortran translation of the R package distr"
maintainer = "Translation generated from distr 2.9.7"
description = "Modern Fortran computational port of the R package distr"
categories = ["statistics", "probability", "distributions"]
gams = ["L"]
keywords = ["distribution", "cdf", "quantile", "random", "convolution", "mixture"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
