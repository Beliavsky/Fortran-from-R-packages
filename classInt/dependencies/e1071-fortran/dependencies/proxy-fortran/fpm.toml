name = "proxy-fortran"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Fortran translation of proxy by David Meyer and Christian Buchta"
maintainer = "OpenAI translation checkpoint"
description = "Modern Fortran translation of the computational core of the R proxy package"
