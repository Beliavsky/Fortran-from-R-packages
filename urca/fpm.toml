name = "urca-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Bernhard Pfaff, Eric Zivot, Matthieu Stigler, James G. MacKinnon; Fortran translation"
maintainer = "Fortran translation maintainers"
copyright = "Copyright upstream urca authors and contributors"
description = "Modern Fortran translation of the computational core of the R package urca"
categories = ["time-series", "econometrics", "statistics"]
keywords = ["unit-root", "cointegration", "stationarity", "structural-break", "critical-values"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
link = ["lapack", "blas"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
