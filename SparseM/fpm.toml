name = "SparseM"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Fortran translation preserving attribution to SparseM authors and contributors"
maintainer = "Fortran-from-R-packages project"
description = "Modern free-form Fortran translation of SparseM computational sparse linear algebra"

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[library]
source-dir = "src"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 45
r_functions_translated = 45
frac_functions_translated = 1.0
untranslated_r_functions = []

