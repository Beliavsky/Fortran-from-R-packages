name = "perm"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Michael P. Fay; Fortran translation contributors"
description = "Exact, Monte Carlo and asymptotic two-sample, k-sample and trend permutation tests"
[build]
auto-executables = false
auto-tests = true
auto-examples = true
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 20
r_functions_translated = 20
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "chooseMatrix"
r_source = "upstream/R/chooseMatrix.R"
fortran_module = "perm_api"
fortran_names = ["choose_matrix"]
fortran_source = "src/perm_api.f90"
status = "complete"
notes = "Enumerates zero/one selection rows in upstream order, with explicit allocation and combinatorial limits."

