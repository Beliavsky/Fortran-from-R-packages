name = "mco-fortran"
version = "1.17.0"
license = "GPL-2.0-only"
author = "Fortran translation contributors"
maintainer = "Fortran translation contributors"
copyright = "Copyright upstream mco authors and translation contributors"
description = "Modern Fortran translation of the computational core of the R mco package"
categories = ["optimization", "numerical"]
gams = ["G"]
keywords = ["optimization", "numerical", "numerical-methods"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
