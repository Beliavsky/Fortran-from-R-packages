name = "anmc-fortran"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Dario Azzimonti; Fortran port contributors"
maintainer = "Fortran port contributors"
copyright = "Copyright Dario Azzimonti and contributors"
description = "Modern Fortran port of the computational code in the R package anMC"
categories = ["statistics", "probability", "monte-carlo"]
keywords = ["orthant-probability", "gaussian", "nested-monte-carlo", "excursion-sets"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L", "M"]
