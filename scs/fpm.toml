name = "scs-fortran"
version = "0.2.0"
license = "GPL-3.0-only"
author = "Fortran translation of the R scs package and upstream SCS"
copyright = "See LICENSE and licenses/"
description = "Modern Fortran translation of the computational core of the R scs package"
categories = ["optimization", "numerical"]
keywords = ["optimization", "numerical", "numerical-methods"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G"]
