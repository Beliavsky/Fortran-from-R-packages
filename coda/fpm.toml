name = "coda-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "coda authors; Fortran translation"
maintainer = "Fortran translation"
copyright = "Copyright (C) coda authors and contributors"
description = "Modern Fortran translation of the computational core of the R coda package"
categories = ["statistics", "mcmc"]
gams = ["L", "M"]
keywords = ["mcmc", "diagnostics", "gelman-rubin", "geweke", "raftery-lewis"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
