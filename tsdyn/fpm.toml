name = "tsdyn-modern-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Original tsDyn authors; modern Fortran translation"
maintainer = "Translation project"
description = "Modern Fortran numerical translation of computational parts of tsDyn"
copyright = "Copyright original tsDyn authors and translation contributors"
categories = ["time-series", "statistics", "numerical"]
keywords = ["estimation", "time-series", "statistics", "numerical", "statistical-computing"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
