name = "mfgarch"
version = "0.2.2"
license = "MIT"
author = "Onno Kleen; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational core of the R package mfGARCH"
categories = ["statistics", "econometrics", "time-series"]
keywords = ["GARCH-MIDAS", "mixed-frequency", "volatility", "GJR-GARCH"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true

[extra.r-fpm-index]
gams = ["L"]
