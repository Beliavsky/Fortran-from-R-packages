name = "cla"
version = "0.96.3"
license = "GPL-3.0-or-later"
author = "Yanhao Shi, Martin Maechler; Fortran translation"
maintainer = "Fortran translation project"
copyright = "Copyright (c) CLA authors and contributors"
description = "Modern Fortran implementation of the Markowitz Critical Line Algorithm"
keywords = ["portfolio", "markowitz", "critical-line", "mean-variance", "garch"]
categories = ["finance", "optimization", "time-series"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[library]
source-dir = "src"

[extra.r-fpm-index]
gams = ["G", "L"]
