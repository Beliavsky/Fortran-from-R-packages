name = "fingraph"
version = "0.1.0"
license = "GPL-3.0-only"
author = "Ze Vinicius and Daniel P. Palomar; modern Fortran translation"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of the computational routines in fingraph"
keywords = ["graphs", "finance", "student-t", "heavy-tails", "admm", "laplacian"]
categories = ["finance", "numerical"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
