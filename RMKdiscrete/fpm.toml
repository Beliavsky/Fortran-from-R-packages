name = "RMKdiscrete-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Robert M. Kirkpatrick; Fortran translation"
maintainer = "Fortran translation"
copyright = "Copyright (c) upstream RMKdiscrete authors"
description = "Modern Fortran translation of the computational code in the R package RMKdiscrete"
categories = ["statistics", "probability"]
keywords = ["lagrangian-poisson", "negative-binomial", "discrete-distributions"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
