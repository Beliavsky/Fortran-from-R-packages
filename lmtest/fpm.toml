name = "lmtest-fortran"
version = "0.1.0"
license = "GPL-2.0-only OR GPL-3.0-only"
author = "Torsten Hothorn, Achim Zeileis, Richard W. Farebrother, Clint Cummins; Fortran translation"
maintainer = "Fortran translation maintainers"
copyright = "Copyright upstream lmtest authors and contributors"
description = "Modern Fortran translation of the computational core of the R package lmtest"
categories = ["statistics", "econometrics", "time-series"]
keywords = ["hypothesis-testing", "regression", "diagnostics", "autocorrelation", "structural-change"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
link = ["lapack", "blas"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["L"]
