name = "car"
version = "3.1.5"
license = "GPL-2.0-or-later"
author = "John Fox, Sanford Weisberg, Brad Price, and car contributors; Fortran translation contributors"
maintainer = "Fortran-from-R-packages maintainers"
description = "Modern Fortran translation of computational kernels from the R car package"
categories = ["statistics"]
keywords = ["regression", "diagnostics", "power-transforms", "statistics"]

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[library]
source-dir = "src"

[[test]]
name = "car-tests"
source-dir = "test"
main = "test_car.f90"

[[example]]
name = "basic"
source-dir = "example/basic"
main = "main.f90"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 51
r_functions_translated = 51
frac_functions_translated = 1.0
untranslated_r_functions = []

