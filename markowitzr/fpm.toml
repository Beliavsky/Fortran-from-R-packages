name = "markowitzr"
version = "1.0.2"
license = "LGPL-3.0-or-later"
author = "Steven E. Pav; modern Fortran derivative work"
maintainer = "Modern Fortran translation contributors"
copyright = "Copyright 2014-2020 Steven E. Pav"
description = "Inference for Markowitz portfolios using unified second moments"
categories = ["finance", "statistics", "portfolio-optimization"]
gams = ["G", "L"]
keywords = ["markowitz", "portfolio", "delta-method", "covariance"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
