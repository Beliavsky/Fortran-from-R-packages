name = "dlm"
version = "0.2.0"
license = "GPL-2.0-or-later"
author = "Fortran translation contributors; upstream dlm by Giovanni Petris"
maintainer = "Fortran-from-R-packages contributors"
description = "Modern Fortran translation of computational portions of the R package dlm"
categories = ["statistics", "state-space", "time-series", "bayesian"]
keywords = ["dynamic-linear-model", "kalman-filter", "smoothing", "forecasting"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-core = { path = "../rfortran-core" }
rfortran-linalg = { path = "../rfortran-linalg" }
optimx-fortran = { path = "../optimx" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 25
r_functions_translated = 25
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "bdiag"
r_source = "provenance/upstream/R/DLM.R"
fortran_module = "dlm"
fortran_names = ["block_diag2"]
fortran_source = "src/dlm_models.f90"
status = "partial"
notes = "The numerical two-matrix block-diagonal operation is translated; R's arbitrary list/variadic container interface is omitted."

