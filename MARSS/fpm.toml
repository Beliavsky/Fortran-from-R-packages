name = "MARSS"
version = "0.6.0"
license = "GPL-2.0-only"
author = "Elizabeth Eli Holmes, Eric J. Ward, Mark D. Scheuerell, Kellie Wills; Fortran translation by OpenAI"
maintainer = "Vivek Rao"
description = "Modern Fortran translation of computational kernels from the R MARSS package"
categories = ["statistics", "time-series", "state-space"]
keywords = ["MARSS", "Kalman-filter", "Kalman-smoother", "EM", "state-space"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }
KFAS = { path = "../KFAS" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 22
r_functions_translated = 22
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "MARSS"
r_source = "upstream/R/MARSS.R"
fortran_modules = ["marss_em", "marss_builder", "marss_dfa_mod", "marss_workflow"]
fortran_names = ["marss", "marss_build", "marss_dfa_build", "marss_from_data"]
fortran_sources = ["src/marss_em.f90", "src/marss_builder.f90", "src/marss_dfa.f90", "src/marss_workflow.f90"]
status = "substantial"
notes = "Fits prepared numerical models and constructs/fits common form=marss, numerical form=marxss, and standard DFA specifications directly from data. Named identity/zero/unconstrained/equal/diagonal/equalvarcov/onestate/scaling structures, G/H/L loadings, optional C/D covariates, and KEM/BFGS dispatch are translated. Mixed numeric/character list-matrix blocks can be converted separately to affine constraints with preserved labels. R formula/S3/factor containers, dimnames, automatic arbitrary-list integration, and exact control semantics are omitted."

[[extra.translation.function]]
r_name = "MARSSaic"
r_source = "upstream/R/MARSSaic.R"
fortran_modules = ["marss_analysis", "marss_bootstrap"]
fortran_names = ["marss_aic", "marss_bootstrap_aic"]
fortran_sources = ["src/marss_analysis.f90", "src/marss_bootstrap.f90"]
status = "substantial"
notes = "AIC/AICc plus parametric-bootstrap AICbp and innovations-bootstrap AICbb are translated. Bootstrap refits can preserve affine f+D*beta constraints and use BFGS or generalized EM; optional logL.star arrays are available. R object mutation/progress output is omitted."

[[extra.translation.function]]
r_name = "MARSSboot"
r_source = "upstream/R/MARSSboot.R"
fortran_module = "marss_bootstrap"
fortran_names = ["marss_boot", "marss_boot_hessian"]
fortran_source = "src/marss_bootstrap.f90"
status = "substantial"
notes = "Parametric and Stoffer-Wall innovations simulation-and-refit bootstrap are translated. Affine f+D*beta constraints can be preserved under BFGS or generalized-EM refitting; constrained outputs use beta coordinates and generated bootstrap data may be returned. param.gen=hessian is available as deterministic multivariate-normal draws from the fitted observed-information covariance in raw or affine-beta coordinates. R progress, RNG-stream, and result-object variants are omitted."


[[extra.translation.function]]
r_name = "MARSScv"
r_source = "upstream/R/MARSScv.R"
fortran_module = "marss_cv_mod"
fortran_names = ["marss_cv"]
fortran_source = "src/marss_cv.f90"
status = "substantial"
notes = "Fold and future cross-validation refitting is translated with missing-data likelihood fitting, deterministic default folds, time-indexed prediction matrices, and prediction standard errors. Affine f+D*beta constraints are preserved under BFGS or generalized-EM refits and fold beta coordinates may be returned. R random-fold/data-frame formatting and all control semantics are omitted."

[[extra.translation.function]]
r_name = "MARSShessian"
r_source = "upstream/R/MARSShessian.R"
fortran_modules = ["marss_analysis", "marss_constraints_mod", "marss_hessian_summary_mod"]
fortran_names = ["marss_hessian", "marss_hessian_linear", "marss_hessian_summary_linear"]
fortran_sources = ["src/marss_analysis.f90", "src/marss_constraints.f90", "src/marss_hessian_summary.f90"]
status = "substantial"
notes = "Numerical packed/constrained Hessians are translated, and marss_hessian_summary_linear reproduces the fitted free-coordinate mean, observed-information matrix, parameter names, and inverse-information covariance with Harvey1989, fdHess, and optim method dispatch. The optim label uses the same central finite-difference information engine as fdHess rather than R optimhess; R object mutation and warning text are omitted."

[[extra.translation.function]]
r_name = "MARSSinits"
r_source = "upstream/R/MARSSinits.R"
fortran_modules = ["marss_model_ops", "marss_initialization"]
fortran_names = ["marss_inits", "marss_inits_linear", "marss_inits_named"]
fortran_sources = ["src/marss_model_ops.f90", "src/marss_initialization.f90"]
status = "substantial"
notes = "Provides simple numerical defaults plus constraint-aware affine initialization. Scalar B/Q/R/V0 defaults are projected from diagonal targets using the upstream nonzero-coefficient time-averaging rule for time-varying affine blocks; Z/U/A/C/D/G/H/L beta defaults follow upstream conventions where applicable; and free x0 is solved from the first observation in constrained coordinates. Partial named beta overrides can be applied using preserved raw or MARSSvectorizeparam-style block-prefixed labels. Specialized R object/list initialization cases and exact error-message semantics are omitted."

[[extra.translation.function]]
r_name = "MARSSkem"
r_source = "upstream/R/MARSSkem.r"
fortran_modules = ["marss_em", "marss_constrained_em"]
fortran_names = ["marss_kem", "marss_kem_linear"]
fortran_sources = ["src/marss_em.f90", "src/marss_constrained_em.f90"]
status = "substantial"
notes = "Implements missing-data-aware EM for unconstrained static blocks and generalized EM for arbitrary affine f+D*beta constraints. Time-varying blocks can be held fixed in ordinary EM and constraint designs may span time-indexed blocks. Diffuse constrained EM and exact specialized upstream analytic M-step/update behavior are omitted."

[[extra.translation.function]]
r_name = "MARSSkemcheck"
r_source = "upstream/R/MARSSkemcheck.r"
fortran_module = "marss_kemcheck_mod"
fortran_names = ["marss_kemcheck"]
fortran_source = "src/marss_kemcheck.f90"
status = "partial"
notes = "Checks numerical dimensions/covariances plus KEM degeneracy restrictions: fully fixed B slices must have spectral radius <= 1; fixed-zero R rows require fixed Z/A/D and satisfy the smoothed fitted-value identity E(y)=Z E(x)+A+Dd within 1e-8; fixed-zero Q placement must be time constant; fixed-zero Q rows require fixed B rows; linked R0-Z-Q0 states and indirectly stochastic zero-Q states require fixed U/C; potential B adjacency is time-constant when zero-Q x0/U components are estimated; and deterministic/indirectly-stochastic state classes are time-constant. Exact R diagnostic messages and higher-level model-construction checks remain omitted."

