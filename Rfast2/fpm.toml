name = "rfast2-fortran"
version = "0.1.0"
license = "GPL-2.0-or-later"
author = "Rfast2 authors; Fortran translation by OpenAI"
maintainer = ""
description = "Modern Fortran computational-core translation of Rfast2"
categories = ["statistics", "numerical", "regression"]
