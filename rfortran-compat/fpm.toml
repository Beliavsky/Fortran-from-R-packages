name = "rfortran-compat"
version = "0.1.0"
license = "MIT"
author = "Vivek Rao and contributors"
maintainer = "Vivek Rao"
description = "Compatibility runtime for Fortran translations generated by R-to-Fortran"
categories = ["numerical", "compatibility"]
keywords = ["R", "runtime", "translation", "compatibility"]

[build]
auto-executables = false
auto-examples = false
auto-tests = false
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
[preprocess.cpp]
suffixes = ["F90"]

[extra.r-fpm-index]
gams = ["Z"]
