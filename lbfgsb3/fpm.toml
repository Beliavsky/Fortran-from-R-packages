name = "lbfgsb3"
version = "0.1.0"
license = "GPL-2.0-only"
author = "lbfgsb3c authors and Fortran port contributors"
maintainer = "Fortran port maintainers"
copyright = "See NOTICE.md and LICENSES"
description = "Modern Fortran interface to L-BFGS-B 3.0 with lbfgsb3c stopping criteria"
keywords = ["optimization", "lbfgsb", "bounds", "quasi-newton"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[library]
source-dir = "src"
