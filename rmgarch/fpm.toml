name = "rmgarch"
version = "0.2.0"
license = "GPL-3.0-only"
author = "Alexios Galanos; experimental Fortran translation contributors"
maintainer = "Vivek Rao"
copyright = "2008-2025 Alexios Galanos; 2026 Fortran translation contributors"
description = "Experimental modern Fortran translation of the computational core of R rmgarch"
keywords = ["multivariate-garch", "dcc", "adcc", "copula", "gogarch", "ica", "finance"]
categories = ["finance", "time-series", "probability"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
