fortran_module = "esg_models"
fortran_names = ["esg_forward_rates"]
fortran_source = "src/esg_models.f90"
status = "substantial"
notes = "Finite-difference extraction retained; typed arrays replace S4 setter and strict shape checks replace R NA removal."

