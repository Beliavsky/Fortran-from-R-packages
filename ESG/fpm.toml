name = "ESG"
version = "1.3.0"
license = "GPL-2.0-or-later"
author = "Jean-Charles Croix, Thierry Moudiki, Frederic Planchet, Wassim Youssef; Fortran translation contributors"
maintainer = "Fortran-from-R-packages contributors"
description = "ESG economic scenarios and source-compatible asset price distributions"
[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
rfortran-core = { path = "../rfortran-core" }
randompack = { path = "../randompack" }

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 20
r_functions_translated = 20
frac_functions_translated = 1.0
untranslated_r_functions = []

[[extra.translation.function]]
r_name = "setForwardRates"
