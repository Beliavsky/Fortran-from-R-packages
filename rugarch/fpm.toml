name = "rugarch_fortran"
version = "0.4.0"
license = "GPL-3.0-only"
author = "Alexios Galanos; independent Fortran translation by Vivek Rao"
maintainer = "Vivek Rao"
description = "Experimental modern Fortran translation of computational parts of the R rugarch package"
categories = ["statistics", "time-series", "finance"]
gams = ["L"]
keywords = ["GARCH", "ARFIMA", "volatility", "risk"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
