name = "nmof"
version = "2.12.0"
license = "GPL-3.0-only"
author = "Enrico Schumann; Fortran translation by OpenAI"
maintainer = "OpenAI"
copyright = "2010-2025 Enrico Schumann"
description = "Modern Fortran translation of the computational algorithms in NMOF"
categories = ["finance", "optimization", "monte-carlo"]
keywords = ["optimization", "portfolio", "options", "bonds", "simulation"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true

[dependencies]
rfortran-linalg = { path = "../rfortran-linalg" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.r-fpm-index]
gams = ["G", "L", "M"]
