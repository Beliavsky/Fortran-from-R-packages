name = "signal"
version = "1.8.1"
license = "GPL-2.0-only"
author = "signal upstream authors and contributors; Fortran translation contributors"
maintainer = "Fortran-from-R-packages maintainers"
copyright = "See NOTICE.md and upstream/COPYRIGHTS"
description = "Modern free-form Fortran translation of computational routines from the R signal package"
categories = ["signal-processing", "numerical"]
keywords = ["filters", "signal-processing", "spectral-analysis", "interpolation"]

[build]
auto-executables = false
auto-examples = true
auto-tests = true

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[extra.translation]
status = "substantial"
coverage_basis = "exported computational R functions"
r_functions_total = 58
r_functions_translated = 58
frac_functions_translated = 1.0
untranslated_r_functions = []

