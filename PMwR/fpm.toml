name = "PMwR-fortran"
version = "1.2.0"
license = "GPL-3.0-only"
author = "Enrico Schumann; Fortran translation contributors"
maintainer = "Fortran translation project"
copyright = "Copyright 2008-2025 Enrico Schumann and Fortran translation contributors"
description = "Modern Fortran portfolio management, accounting, return analysis, attribution, and backtesting tools"
keywords = ["portfolio", "backtest", "returns", "trades", "accounting", "attribution"]
categories = ["finance", "statistics", "numerical"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[[executable]]
name = "demo_pmwr"
source-dir = "app"
main = "demo_pmwr.f90"
