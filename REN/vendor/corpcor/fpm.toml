name = "corpcor"
version = "1.6.10"
license = "GPL-3.0-or-later"
author = "Fortran translation of the corpcor authors' work"
maintainer = ""
copyright = "2003-2026 corpcor authors and contributors"
description = "Modern Fortran translation of corpcor covariance and partial-correlation estimators"
categories = ["statistics", "linear-algebra"]
keywords = ["covariance", "shrinkage", "partial-correlation", "pseudoinverse"]

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
