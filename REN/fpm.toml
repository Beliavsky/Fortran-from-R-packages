name = "ren"
version = "0.1.0"
license = "AGPL-3.0-or-later"
author = "Hardik Dixit, Shijia Wang, Bonsoo Koo, Cash Looi, Hong Wang; Fortran translation"
maintainer = "Fortran translation project"
description = "Modern Fortran translation of REN regularization ensembles for portfolio optimization"
categories = ["finance", "statistics", "optimization"]
keywords = ["portfolio", "regularization", "lasso", "ridge", "ensemble"]

[library]
source-dir = "src"

[build]
auto-executables = true
auto-examples = true
auto-tests = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
corpcor = { path = "vendor/corpcor" }
